name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── .NET service ─────────────────────────────────────────────────────────────
  test-dotnet:
    name: .NET — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Run tests
        run: |
          dotnet test --no-build -c Release \
            --logger "console;verbosity=normal" \
            --results-directory /tmp/dotnet-test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: /tmp/dotnet-test-results

  # ── Go service ───────────────────────────────────────────────────────────────
  test-go:
    name: Go — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/go/go.sum

      - name: Tidy modules
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run tests (with race detector)
        run: go test ./... -v -race -timeout 60s

  # ── Analysis (Python) ────────────────────────────────────────────────────────
  test-analysis:
    name: Analysis — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ── Docker image builds ──────────────────────────────────────────────────────
  docker-build:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [test-dotnet, test-go]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build .NET image
        uses: docker/build-push-action@v5
        with:
          context: services/dotnet
          push: false
          tags: eda-dotnet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Go image
        uses: docker/build-push-action@v5
        with:
          context: services/go
          push: false
          tags: eda-go:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: dotnet-service
    static_configs:
      - targets: ["dotnet-service:8080"]
    metrics_path: /metrics

  # Uncomment in P3 after the Go service is running
  # - job_name: go-service
  #   static_configs:
  #     - targets: ["go-service:8081"]
  #   metrics_path: /metrics
